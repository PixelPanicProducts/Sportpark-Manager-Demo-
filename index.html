function renderReport(){let info=weekInfo(dateFromWeek());let data=state.reports[state.week]||{};let days=[0,1,2,3,4,5,6];let out=`<section class="panel"><h2>Tagesberichte</h2><div class="toolbar"><button onclick="changeWeek(-1)">◀ Woche zurück</button><strong>Woche ${info.week} / ${info.year}</strong><button onclick="changeWeek(1)">Nächste Woche ▶</button><button onclick="exportWeekXlsx()" class="primary">Excel speichern</button><button id="teamsShare" onclick="shareWeek()" ${state.sharedWeeks[state.week]===weekSignature(state.week)?'disabled':''}>Teilen mit Teams</button></div><div class="favtop"><strong>Schnellauswahl:</strong> <button onclick="showQuick()">Eintrag wählen</button></div><p class="hint">Jede Zelle lässt sich einzeln bearbeiten. Alle Änderungen werden automatisch lokal gespeichert. „Excel speichern“ schließt eine noch offene Woche ab und öffnet die nächste; alte Wochen bleiben im Archiv.</p><div class="sheetwrap" id="reportSwipeArea"><div class="paper" id="printPaper"><div class="paperhead"><span>Name, Vorname<br>${esc(state.name)}</span><span>Personalnummer<br>${esc(state.personal)}</span><span>Woche<br>${info.week}</span><span>${info.year}</span></div><table><colgroup>${widths.map(w=>`<col style="width:${w}%">`).join('')}</colgroup><thead><tr>${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>`;
for(let d of days){let date=new Date(info.start);date.setDate(date.getDate()+d);out+=`<tr class="day"><td colspan="7">${dayNames[d]}, Datum &nbsp; ${pad(date.getDate())}.${pad(date.getMonth()+1)}.${date.getFullYear()}</td></tr>`;for(let r=0;r<counts[d];r++){out+='<tr>';for(let f=0;f<7;f++){let k=reportCellKey(d,r,fields[f]);let val=data[k]||'';out+=`<td><button title="${esc(val)}" onclick="editCell(${d},${r},${f})">${esc(val)||'&nbsp;'}</button></td>`}out+='</tr>'}}
out+='</tbody></table>';out+=`<div class="mobile-days"><div class="mobile-page"><div class="mobile-table-scroll"><table class="compact-report"><colgroup>${widths.map(w=>`<col style="width:${w}%">`).join('')}</colgroup><thead><tr>${labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr></thead><tbody>`;for(let d=0;d<7;d++){let date=new Date(info.start);date.setDate(date.getDate()+d);out+=`<tr class="compact-day"><td colspan="7">${dayNames[d]} · ${pad(date.getDate())}.${pad(date.getMonth()+1)}.${date.getFullYear()}</td></tr>`;for(let r=0;r<counts[d];r++){out+='<tr>';for(let f=0;f<fields.length;f++){let val=data[reportCellKey(d,r,fields[f])]||'';out+=`<td><button title="${esc(labels[f])}: ${esc(val)}" onclick="editCell(${d},${r},${f})">${esc(val)||'+'}</button></td>`}out+='</tr>'}}out+='</tbody></table></div></div></div>';out+='</div></div></section>' ;return out}
function setSide(next){if(side===next)return;side=next;render();const switcher=document.querySelector('.side-switch');if(switcher) switcher.scrollIntoView({block:'nearest'});}
function editCell(d,r,f){saveReportPosition({d,r,f});let key=reportCellKey(d,r,fields[f]);let old=(state.reports[state.week]||{})[key]||'';let list=({1:'auftraege',2:'taetigkeiten',3:'fahrzeuge'})[f];if(f===0||f>=4){showTimeChoices(d,r,old,f);return}if(f===3){showVehicleChoices(d,r,old);return}if(list){let data=STAMMDATEN[list];$('modal').innerHTML=`<div class="dialogshade" onclick="closeModal(event)"><div class="dialog"><div class="toolbar"><strong>${esc(labels[f])} auswählen</strong><button onclick="hideModal()">✕</button></div><input id="choiceSearch" placeholder="Nummer oder Bezeichnung suchen" oninput="filterChoices('${list}',${d},${r},${f})"><div class="choices" id="choices" role="listbox" aria-label="Auswahlliste"></div><button onclick="setCell(${d},${r},${f},'')">Eintrag löschen</button></div></div>`;filterChoices(list,d,r,f);}else{let val=prompt(labels[f]+' eingeben:',old);if(val!==null)setCell(d,r,f,val)}}

const TIME_OTHER=['0,75','1,25','1,5','1,75','2','2,25','2,5','2,75','3','3,25','3,5','4','4,25','4,5','5','5,25','5,5','5,75','6','6,25','6,5','6,75','7','7,25','7,5','7,75','8','8,25','8,75','9'];
function showTimeChoices(d,r,old,f=0){

const timeButton=(v,fav)=>`<button type="button" class="time-choice ${fav?'time-favorite':''}" onclick="setCell(${d},${r},${f},'${v}')">${v} h</button>`;

function saveCustomTime(d,r,f=0){let v=$('customTime').value.trim();if(f===6){if(!v||v.length>20){alert('Bitte eine Zahl oder ein kurzes Kürzel eingeben (maximal 20 Zeichen).');return}if(/^\d+(?:[.,]\d{1,2})?$/.test(v))v=v.replace('.',',')}else{v=v.replace('.',',');if(!/^\d+(,\d{1,2})?$/.test(v)){alert('Bitte eine gültige Stundenzahl eingeben, z. B. 4,75.');return}}setCell(d,r,f,v)}
const FAVORITES={auftraege:[],taetigkeiten:[],fahrzeuge:[]};
state.favorites ||= JSON.parse(JSON.stringify(FAVORITES));
function normFav(id){return String(Number(String(id).replace(/\D/g,'')))}
function favIndex(list,id){return (state.favorites[list]||[]).findIndex(x=>normFav(x)===normFav(id))}
function favItem(list,id){return STAMMDATEN[list].find(x=>normFav(x.id)===normFav(id))}
function showFavoriteManager(list='auftraege'){const names={auftraege:'Aufträge',taetigkeiten:'Tätigkeiten',fahrzeuge:'Fahrzeuge'};let items=(state.favorites[list]||[]).map(id=>favItem(list,id)).filter(Boolean);$('modal').innerHTML=`<div class="dialogshade" onclick="closeModal(event)"><div class="dialog fav-dialog"><div class="toolbar"><strong>Favoriten bearbeiten</strong><button onclick="hideModal()">✕</button></div><div class="fav-tabs">${Object.entries(names).map(([key,name])=>`<button class="${list===key?'active':''}" onclick="showFavoriteManager('${key}')">${name}</button>`).join('')}</div><p class="hint">Am Griff ≡ gedrückt halten und an die gewünschte Stelle ziehen. Auf dem PC auch mit der Maus.</p><div id="favoriteRows" class="favorite-rows">${items.map(x=>`<div class="favorite-row" data-fav-id="${esc(x.id)}"><span class="drag-handle" title="Zum Sortieren ziehen">☰</span><span class="fav-description"><b>${esc(x.id)}</b><span>${esc(x.label)}</span></span><button class="remove-fav" onclick="removeFavorite('${list}','${x.id}')" aria-label="Favorit entfernen">✕</button></div>`).join('')}</div><button class="primary add-favorite" onclick="showAddFavorite('${list}')">＋ Favorit hinzufügen</button></div></div>`;installFavDrag(list)}
function removeFavorite(list,id){state.favorites[list]=state.favorites[list].filter(x=>normFav(x)!==normFav(id));persist();showFavoriteManager(list)}
function showAddFavorite(list){const items=STAMMDATEN[list].filter(x=>favIndex(list,x.id)<0);$('modal').innerHTML=`<div class="dialogshade" onclick="closeModal(event)"><div class="dialog fav-dialog"><div class="toolbar"><strong>Favorit hinzufügen</strong><button onclick="showFavoriteManager('${list}')">← Zurück</button></div><input id="favAddSearch" placeholder="Nummer oder Begriff suchen" oninput="filterFavAdd('${list}')"><div id="favAddResults" class="fav-add-results"></div></div></div>`;filterFavAdd(list)}
function filterFavAdd(list){let q=$('favAddSearch').value.toLowerCase();let items=STAMMDATEN[list].filter(x=>favIndex(list,x.id)<0&&(x.id+' '+x.label).toLowerCase().includes(q));$('favAddResults').innerHTML=items.map(x=>`<button class="fav-add-row" onclick="addFavorite('${list}','${x.id}')"><span><b>${esc(x.id)}</b><span>${esc(x.label)}</span></span><strong>＋</strong></button>`).join('')||'<p>Keine weiteren Einträge gefunden.</p>'}
function addFavorite(list,id){state.favorites[list].push(id);persist();showFavoriteManager(list)}
function installFavDrag(list){let root=$('favoriteRows'),drag=null,ghost=null;
function findTarget(y){let rows=[...root.querySelectorAll('.favorite-row')];return rows.find(el=>{let r=el.getBoundingClientRect();return y<r.top+r.height/2})||null}
root.addEventListener('pointerdown',e=>{let handle=e.target.closest('.drag-handle');if(!handle)return;let row=handle.closest('.favorite-row');drag={row,id:e.pointerId,startY:e.clientY,active:false};handle.setPointerCapture(e.pointerId);handle.style.touchAction='none';e.preventDefault()});
root.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.active&&Math.abs(e.clientY-drag.startY)>5){drag.active=true;drag.row.classList.add('dragging')}if(!drag.active)return;let target=findTarget(e.clientY);if(target!==drag.row){if(target)root.insertBefore(drag.row,target);else root.appendChild(drag.row)}e.preventDefault()});
function finish(e){if(!drag||e.pointerId!==drag.id)return;drag.row.classList.remove('dragging');if(drag.active){state.favorites[list]=[...root.querySelectorAll('.favorite-row')].map(el=>el.dataset.favId);persist()}drag=null}
root.addEventListener('pointerup',finish);root.addEventListener('pointercancel',finish);
}

function filterVehicleChoices(d,r){let q=$('vehicleSearch').value.toLowerCase();let items=STAMMDATEN.fahrzeuge.filter(x=>(x.id+' '+x.label).toLowerCase().includes(q));items.sort((a,b)=>{let ai=favIndex('fahrzeuge',a.id),bi=favIndex('fahrzeuge',b.id);return ai<0&&bi<0?0:ai<0?1:bi<0?-1:ai-bi});$('vehicleChoices').innerHTML=items.map(x=>`<button class="${favIndex('fahrzeuge',x.id)>=0?'favorite-choice':''}" onclick="setCell(${d},${r},3,'${x.id}')"><b>${esc(x.id)}</b><span>${esc(x.label)}</span></button>`).join('')||'<p>Keine Treffer</p>'}

function weekSignature(key){return JSON.stringify([state.reports[key]||{},state.name,state.personal]);}
function renderArchive(){
 const reports=state.reports&&typeof state.reports==='object'?state.reports:{};
 const sharedWeeks=state.sharedWeeks&&typeof state.sharedWeeks==='object'?state.sharedWeeks:{};
 const completedReports=state.completedReports&&typeof state.completedReports==='object'?state.completedReports:{};
 const keys=[...new Set([...Object.keys(reports),...Object.keys(sharedWeeks),...Object.keys(completedReports),state.week])].filter(key=>/^\d{4}-\d{2}-\d{2}$/.test(key)).sort().reverse();
 let out='<section class="panel"><h2>Archiv – Tagesberichte</h2><p class="hint">Abgeschlossene Wochen bleiben erhalten. Grüner Haken = Teilen gestartet; ein Download bestätigt keinen Versand.</p>';
 for(const key of keys){
  try{
   const parts=key.split('-').map(Number),i=weekInfo(new Date(parts[0],parts[1]-1,parts[2]));
   const shared=sharedWeeks[key]===weekSignature(key)&&sharedWeeks[key]!==undefined;
   const completed=!!completedReports[key];
   const status=shared?'Teilen gestartet':completed?'Excel gespeichert · nicht geteilt':'Nicht geteilt oder seitdem geändert';
   out+='<div class="meter"><div><strong>'+(shared?'✅':'📄')+' KW '+String(i.week).padStart(2,'0')+' / '+i.year+'</strong><small>'+status+'</small></div><button onclick="openArchivedWeek(\''+key+'\')">Öffnen</button></div>';
  }catch(err){console.error('Archiv-Eintrag konnte nicht dargestellt werden',key,err)}
 }
 return out+'</section>';
}
function openArchivedWeek(key){state.week=key;side=0;persist();go('berichte')}
async function shareWeek(){
 const key=state.week,info=weekInfo(dateFromWeek()),filename='Tagesbericht_KW'+String(info.week).padStart(2,'0')+'_'+info.year+'.xlsx';
 let blob;try{blob=buildWeekXlsxBlob()}catch(err){alert('Excel-Erstellung fehlgeschlagen: '+err.message);return}
 const file=new File([blob],filename,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
   // The share sheet cannot be observed directly. Keep any previous marker
   // until the platform confirms the sharing interaction completed.
   const previousMarker=state.sharedWeeks[key];
   try{
     await navigator.share({files:[file],title:filename});
     state.sharedWeeks[key]=weekSignature(key);persist();render();
   }catch(err){
     if(previousMarker===undefined)delete state.sharedWeeks[key];
     else state.sharedWeeks[key]=previousMarker;
     persist();render();
     if(err.name!=='AbortError')showShareFallback(filename,blob,err);
   }
 }else{
   showShareFallback(filename,blob);
 }
}

function restore(e){const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Sicherung zu groß (maximal 5 MB).');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||typeof obj!=='object'||Array.isArray(obj)||!obj.reports||typeof obj.reports!=='object'||Array.isArray(obj.reports)||!obj.meters||typeof obj.meters!=='object'||Array.isArray(obj.meters))throw Error('Ungültige Sicherung');if(obj._backupMeta?.format!=='sportpark-manager-demo-backup')throw Error('Diese Demo akzeptiert nur Sicherungen aus der Demo. Private Arbeitsdaten bitte ausschließlich in der privaten App wiederherstellen.');if(!Array.isArray(obj.tasks||[])||!Array.isArray(obj.firms||[])||!Array.isArray(obj.reminders||[]))throw Error('Ungültige Listen in der Sicherung');if(confirm('Sicherung enthält '+Object.keys(obj.reports).length+' Wochenberichte und '+Object.keys(obj.meters).length+' Monatsdatensätze.\n\nACHTUNG: Alle aktuell in dieser App gespeicherten Daten werden ersetzt.\n\nVorher möglichst eine Sicherung der aktuellen Daten herunterladen.\n\nSicherung jetzt wiederherstellen?')){const position=obj._backupMeta?.reportPosition;delete obj._backupMeta;state=obj;state.reports ||= {};state.meters ||= {};state.tasks ||= [];state.firms ||= [];state.reminders ||= [];state.completedReports ||= {};state.completedMeters ||= {};state.sharedWeeks ||= {};lastPosition=(position&&typeof position==='object'&&position.week===state.week)?position:{};try{if(lastPosition.week)localStorage.setItem(POSITION_KEY,JSON.stringify(lastPosition));else localStorage.removeItem(POSITION_KEY)}catch(err){console.warn('Berichtsposition konnte nicht gespeichert werden',err)}persist();render();restoreReportPosition()}}catch(err){alert('Sicherung konnte nicht gelesen werden: '+err.message)}finally{e.target.value=''}};reader.onerror=()=>{alert('Sicherungsdatei konnte nicht gelesen werden');e.target.value=''};reader.readAsText(f)}
async function downloadReport(){let el=$('printPaper');let c=document.createElement('canvas');const scale=2;c.width=840*scale;c.height=1300*scale;let ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,840,1300);ctx.fillStyle='#000';ctx.font='bold 16px Arial';let info=weekInfo(dateFromWeek());ctx.fillText('Name, Vorname',20,25);ctx.fillText('Personalnummer',360,25);ctx.fillText('Woche',685,25);ctx.fillText(info.year,770,25);ctx.font='16px Arial';ctx.fillText(state.name,20,50);ctx.fillText(state.personal,360,50);ctx.fillText(info.week,695,50);let xs=[20,76,326,393,655,711,773,820],y=65;ctx.lineWidth=1.3;function cell(x1,x2,top,height,text,bold=false){ctx.strokeRect(x1,top,x2-x1,height);ctx.font=(bold?'bold ':'')+'12px Arial';ctx.fillStyle='#000';if(text)ctx.fillText(String(text).slice(0,Math.floor((x2-x1)/7)),x1+4,top+height/2+4)};labels.forEach((t,i)=>cell(xs[i],xs[i+1],y,56,t,true));y+=56;let days=side===0?[0,1,2]:[3,4,5,6],data=state.reports[state.week]||{};for(let d of days){let date=new Date(info.start);date.setDate(date.getDate()+d);cell(xs[0],xs[7],y,24,`${dayNames[d]}, Datum   ${pad(date.getDate())}.${pad(date.getMonth()+1)}.${date.getFullYear()}`,true);y+=24;for(let r=0;r<counts[d];r++){for(let f=0;f<7;f++)cell(xs[f],xs[f+1],y,42,data[reportCellKey(d,r,fields[f])]||'');y+=42}}if(side===1){ctx.font='11px Arial';ctx.fillText('Samstagsstunden: nach 13:00 Uhr    Nachtstunden: zwischen 21:00 Uhr und 06:00 Uhr',20,y+22)}c.toBlob(blob=>{if(blob){download(`Tagesbericht_${state.week}_${side===0?'Vorderseite':'Rueckseite'}.jpg`,blob);state.completedReports[state.week] ||= {};state.completedReports[state.week][side===0?'front':'back']=true;persist()}},'image/jpeg',.94)}

function editQuick(i){let q=i<0?{name:'',order:'',activity:''}:state.quick[i];let name=prompt('Bezeichnung',q.name);if(name===null||!name.trim())return;let order=prompt('Auftragsnummer (z. B. TEST-001)',q.order);if(order===null)return;let activity=prompt('Tätigkeitsnummer (z. B. 27)',q.activity);if(activity===null)return;order=order.trim();if(/^\d+$/.test(order))order='TEST-'+order.padStart(5,'0');let entry={name:name.trim(),order,activity:activity.trim()};if(i<0)state.quick.push(entry);else state.quick[i]=entry;persist();manageQuick()}

function xmlSafe(value){return String(value??'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[ch]))}
function templateCell(xml,ref,value){
  const pattern=new RegExp('<(?:x:)?c\\b[^>]*\\br="'+ref+'"[^>]*>');
  const match=pattern.exec(xml);
  if(!match)throw Error('Missing template cell '+ref);
  const tag=match[0],prefix=tag.startsWith('<x:')?'x:':'';
  const style=(tag.match(/\s+s="([^"]*)"/)||[])[1];
  const attr=style?' s="'+style+'"':'';
  const replacement='<'+prefix+'c r="'+ref+'"'+attr+' t="inlineStr"><'+prefix+'is><'+prefix+'t xml:space="preserve">'+xmlSafe(value)+'</'+prefix+'t></'+prefix+'is></'+prefix+'c>';
  let end=match.index+tag.length;
  if(!/\/\s*>$/.test(tag)){
    const closing='</'+prefix+'c>';
    const closeAt=xml.indexOf(closing,end);
    if(closeAt<0)throw Error('Unclosed template cell '+ref);
    end=closeAt+closing.length;
  }
  return xml.slice(0,match.index)+replacement+xml.slice(end);
}

function combineWeekSheets(entries){
 const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
 const parser=new DOMParser(),serializer=new XMLSerializer();
 const front=parser.parseFromString(entries['xl/worksheets/sheet1.xml'],'application/xml');
 const back=parser.parseFromString(entries['xl/worksheets/sheet2.xml'],'application/xml');
 if(front.querySelector('parsererror')||back.querySelector('parsererror'))throw Error('Could not read worksheet XML');
 const frontData=front.getElementsByTagNameNS(ns,'sheetData')[0];
 const backData=back.getElementsByTagNameNS(ns,'sheetData')[0];
 const frontMerges=front.getElementsByTagNameNS(ns,'mergeCells')[0];
 const backMerges=back.getElementsByTagNameNS(ns,'mergeCells')[0];
 if(!frontData||!backData||!frontMerges||!backMerges)throw Error('Worksheet layout incomplete');
 // The first sheet has three days, ending at row 27. Its blank fourth-day section is removed.
 for(const row of Array.from(frontData.children)){if(Number(row.getAttribute('r'))>=28)frontData.removeChild(row)}
 for(const merge of Array.from(frontMerges.children)){if(Number((merge.getAttribute('ref')||'').match(/\d+/)?.[0])>=28)frontMerges.removeChild(merge)}
 // Reuse the original back-side rows and cell styles; append Thursday–Sunday below Wednesday.
 const shift=24;
 for(const row of Array.from(backData.children)){
   const old=Number(row.getAttribute('r'));if(old<4)continue;
   const clone=front.importNode(row,true);clone.setAttribute('r',String(old+shift));
   for(const cell of Array.from(clone.getElementsByTagNameNS(ns,'c'))){
     cell.setAttribute('r',cell.getAttribute('r').replace(/(\d+)$/,(_,n)=>String(Number(n)+shift)));
   }
   frontData.appendChild(clone);
 }
 for(const merge of Array.from(backMerges.children)){
   const ref=merge.getAttribute('ref');if(Number(ref.match(/\d+/)?.[0])<4)continue;
   const clone=front.importNode(merge,true);
   clone.setAttribute('ref',ref.replace(/\d+/g,n=>String(Number(n)+shift)));
   frontMerges.appendChild(clone);
 }
 entries['xl/worksheets/sheet1.xml']=serializer.serializeToString(front);
 // Keep the original second worksheet in the file for compatibility, but hide it from Excel tabs.
 entries['xl/workbook.xml']=entries['xl/workbook.xml'].replace(/(<x:sheet\b[^>]*name="Rückseite")/, '$1 state="hidden"');
 entries['xl/workbook.xml']=entries['xl/workbook.xml'].replace('name="Vorderseite"','name="Wochenbericht"');
}
function buildWeekXlsxBlob(){
 const info=weekInfo(dateFromWeek()),data=state.reports[state.week]||{};
 const rows=[['DEMO-WOCHENBERICHT','Woche '+info.week+'/'+info.year],['Name',state.name||'Testperson','Personalnummer',state.personal||''],['Tag','Datum',...labels]];
 for(let d=0;d<7;d++){
   const date=new Date(info.start);date.setDate(date.getDate()+d);
   for(let r=0;r<counts[d];r++){
     rows.push([dayNames[d],iso(date),...fields.map(f=>data[reportCellKey(d,r,f)]||'')]);
   }
 }
 return makeXlsx([{name:'Wochenbericht DEMO',rows}]);
}
function exportWeekXlsx(){
 try{
  const key=state.week,i=weekInfo(dateFromWeek());
  download('Tagesbericht_KW'+String(i.week).padStart(2,'0')+'_'+i.year+'.xlsx',buildWeekXlsxBlob());
  const wasCompleted=!!state.completedReports[key];
  state.completedReports[key]=true;
  if(!wasCompleted){
   let next=new Date(i.start);next.setDate(next.getDate()+7);
   state.week=iso(next);side=0;
   persist();render();
   alert('Excel-Download gestartet. Woche '+i.week+'/'+i.year+' ist im Archiv abgeschlossen; Woche '+weekInfo(next).week+'/'+weekInfo(next).year+' ist jetzt geöffnet. Der Download bestätigt keinen Versand.');
  }else{persist();render()}
 }catch(err){console.error(err);alert('Excel-Export fehlgeschlagen: '+err.message)}
}
function buildMeterXlsxBlob(month=state.month){let data=state.meters[month]||{};let rows=[['Verbrauchswerte',month],['Verbrauchsstelle','Adresse','Sparte','Zählernummer','Zählerstand'],...ZAEHLER.map(a=>[...a,data[a[3]]||''])];return makeXlsx([{name:'Verbrauchswerte',rows,widths:[37,28,16,24,20]}])}
function exportMeterXlsx(){try{const month=state.month;download('Verbrauch_'+month+'.xlsx',buildMeterXlsxBlob(month));state.completedMeters[month]=true;persist()}catch(err){console.error(err);alert('Excel-Export fehlgeschlagen: '+err.message)}}
function showShareFallback(filename,blob,err){
 const reason=err?'Der Browser hat die direkte Dateifreigabe verweigert ('+err.message+').':'Der Browser unterstützt die direkte Excel-Dateifreigabe nicht.';
 alert(reason+'\n\nDie Excel-Datei wird stattdessen heruntergeladen. Öffne sie danach in Excel und verwende dort das Teilen-Symbol für Teams oder E-Mail.\n\nEs wird kein Teilen-Erfolgsstatus gesetzt.');
 download(filename,blob);
}
async function shareMeterXlsx(){
 const month=state.month,filename='Verbrauch_'+month+'.xlsx';
 let blob;try{blob=buildMeterXlsxBlob(month)}catch(err){alert('Excel-Erstellung fehlgeschlagen: '+err.message);return}
 const file=new File([blob],filename,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Verbrauchswerte '+month});state.completedMeters[month]=true;persist();render()}
  catch(err){if(err.name!=='AbortError')showShareFallback(filename,blob,err);}
 }else{
  showShareFallback(filename,blob);
 }
}
